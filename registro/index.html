<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoMania | Crear Cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/registro/style.css">
</head>
<body>
  <div class="bg-shapes">
    <span class="shape shape-1"></span>
    <span class="shape shape-2"></span>
    <span class="shape shape-3"></span>
  </div>

  <main class="auth-wrapper">
    <div class="brand-top">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="brand-name">AutoMania</h1>
    </div>

    <div class="card">
      <header class="card-header">
        <h2>Crear Cuenta</h2>
        <p>Comienza a automatizar en minutos</p>
      </header>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Luis García" required>
          </div>
          <span class="error" data-error="nombre"></span>
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2"/><path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2"/></svg>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
          </div>
          <span class="error" data-error="email"></span>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/></svg>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">
            <button type="button" class="toggle-pass" data-target="password" aria-label="Mostrar contraseña">👁</button>
          </div>
          <div class="strength-bar"><span id="strengthFill"></span></div>
          <span class="error" data-error="password"></span>
        </div>

        <div class="field">
          <label for="confirm">Confirmar contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/></svg>
            <input type="password" id="confirm" name="confirm" placeholder="Repite la contraseña" required>
          </div>
          <span class="error" data-error="confirm"></span>
        </div>

        <label class="checkbox">
          <input type="checkbox" id="terminos" required>
          <span>Acepto los <a href="#">términos y condiciones</a></span>
        </label>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-text">Registrarse</span>
          <span class="btn-loader"></span>
        </button>

        <p class="switch-text">¿Ya tienes cuenta? <a href="../login/index.html">Inicia sesión</a></p>
      </form>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/registro/script.js"></script>
</body>
</html>
